<!DOCTYPE html>
<html lang="en" class="chat-html">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, interactive-widget=resizes-content" />
  <title>Customer Live Chat — Nkem Global</title>
  <meta name="description" content="Direct customer live chat support with Nkem Global." />
  <link rel="stylesheet" href="css/styles.css?v=20261109_2200" />
</head>
<body class="chat-body">

  <!-- ==========================================================================
       USER LIVE CHAT APPLICATION (DIRECT FIXED VIEWPORT — MATCHES ADMIN CHAT)
       ========================================================================== -->
  <div class="user-chat-viewport" id="chatActiveCard" style="display: none;">
    <!-- Unified Chat Header: Store Back Button + Support Branding + User Status -->
    <header class="chat-header">
      <div class="chat-header-info">
        <a href="index.html" class="btn btn-secondary btn-sm chat-back-btn" id="chatBackToStoreBtn" title="Back to Store">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="width: 14px; height: 14px;"><polyline points="15 18 9 12 15 6"/></svg>
          <span>Store</span>
        </a>
        <div class="chat-avatar-status">
          <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </div>
        <div class="chat-header-text">
          <h3 class="chat-header-title">Nkem Global Support</h3>
          <span class="chat-header-status">
            <span class="status-dot"></span> Live Mode
          </span>
        </div>
      </div>

      <div id="chatUserBadge" class="chat-user-badge-wrap">
        <!-- Rendered by chat-page.js: Daniel (08142414888) -->
      </div>
      <div id="headerAuthContainer" style="display: none;"></div>
    </header>

    <!-- Messages Viewport (The ONLY scrolling element) -->
    <div class="chat-messages-container" id="chatMessagesList">
      <div style="text-align: center; padding: 32px; color: var(--text-muted); font-size: var(--font-sm);">
        Loading live conversation...
      </div>
    </div>

    <!-- Chat Input Bar (Firmly pinned to the bottom) -->
    <div class="chat-input-bar">
      <input type="file" id="chatHiddenFileInput" accept="image/*" style="display: none;" />
      <button class="chat-upload-btn" id="chatImageUploadBtn" type="button" title="Attach Image (&le; 100KB)">
        <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      </button>
      <input
        type="search"
        class="chat-text-input"
        id="chatMsgInput"
        name="chat_message_entry"
        placeholder="Type message to Nkem Global..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="sentences"
        spellcheck="false"
        data-form-type="other"
        data-lpignore="true"
        data-1p-ignore="true"
        enterkeyhint="send"
      />
      <button class="chat-send-btn" id="chatSendBtn" type="button">
        <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        <span>Send</span>
      </button>
    </div>
  </div>

  <!-- Guest Auth Gate Card (Shown when user is NOT authenticated) -->
  <div class="chat-auth-prompt-card" id="chatAuthGateCard" style="display: none;">
    <div class="chat-avatar-status" style="width: 56px; height: 56px; margin: 0 auto; background: #e8f7ee; color: #087f3b; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1.5px solid #c2e8d0;">
      <svg class="svg-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 28px; height: 28px;"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
    </div>
    <h2 style="font-size: 1.25rem; font-weight: 800; color: #073b1f; margin: 12px 0 6px;">Sign In to Chat with Support</h2>
    <p style="font-size: 0.88rem; color: #5a6e62; line-height: 1.6; max-width: 400px; text-align: center; margin: 0 0 18px;">
      Sign in to start a direct, real-time message exchange with Nkem Global. Your chat history and unread alerts sync securely across your devices.
    </p>
    <div style="display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 280px;">
      <button class="btn btn-primary" id="gateSignInBtn" type="button" style="width: 100%; justify-content: center; background-color: #087f3b; border-color: #087f3b; padding: 11px; font-weight: 700;">
        <span>Sign In</span>
      </button>
      <button class="btn btn-secondary" id="gateSignUpBtn" type="button" style="width: 100%; justify-content: center; padding: 11px; font-weight: 700;">
        <span>Create New Account</span>
      </button>
      <a href="https://wa.me/2348155608447?text=Hello%20Nkem%20Global%2C%20I%20want%20to%20chat%20with%20support" target="_blank" rel="noopener" class="btn btn-secondary" style="width: 100%; justify-content: center; gap: 8px; text-decoration: none; color: #166534; border-color: #25D366; font-size: 0.82rem; padding: 10px;">
        <span style="color: #25D366; display: inline-flex; align-items: center; width: 16px; height: 16px;">
          <svg class="svg-icon svg-whatsapp" viewBox="0 0 24 24" fill="currentColor" style="width: 16px; height: 16px;"><path d="M17.472 14.382c-.301-.15-1.78-.878-2.056-.978-.275-.101-.476-.15-.676.15-.2.301-.776.978-.952 1.18-.175.2-.351.225-.652.075-.301-.15-1.27-.468-2.42-1.494-.894-.799-1.498-1.786-1.674-2.087-.175-.301-.019-.464.132-.614.136-.135.301-.351.451-.527.151-.175.201-.301.301-.501.1-.2.05-.376-.025-.526-.075-.15-.676-1.63-.926-2.232-.244-.588-.492-.508-.676-.517-.175-.009-.376-.011-.577-.011s-.527.075-.802.376c-.276.301-1.053 1.029-1.053 2.509 0 1.48 1.078 2.91 1.229 3.111.15.2 2.122 3.24 5.141 4.545.718.31 1.278.496 1.716.635.722.23 1.38.197 1.9-.119.58-.354 1.78-1.455 2.03-2.866.25-1.411.25-2.621.175-2.871-.075-.25-.276-.376-.577-.526zM12.04 2C6.51 2 2.03 6.48 2.03 12.01c0 1.98.58 3.82 1.58 5.37L2 22l4.78-1.55c1.5 1 3.29 1.56 5.26 1.56 5.53 0 10.01-4.48 10.01-10.01C22.05 6.48 17.57 2 12.04 2zm0 18.25c-1.72 0-3.32-.51-4.67-1.39l-.33-.22-2.84.92.93-2.77-.24-.35A8.2 8.2 0 0 1 3.83 12c0-4.53 3.68-8.21 8.21-8.21 4.53 0 8.21 3.68 8.21 8.21 0 4.53-3.68 8.25-8.21 8.25z"/></svg>
        </span>
        <span>Chat on WhatsApp Instead</span>
      </a>
      <a href="index.html" style="font-size: 0.8rem; color: #087f3b; text-align: center; text-decoration: underline; margin-top: 6px; font-weight: 600;">
        &larr; Return to Browse Store
      </a>
    </div>
  </div>

  <!-- Full View Lightbox (Only Image & X Under) -->
  <div class="full-view-lightbox" id="fullViewLightbox"></div>

  <!-- Script Modules in Order -->
  <script src="js/icons.js?v=20261109_2200"></script>
  <script src="js/image-compressor.js?v=20261109_2200"></script>
  <script src="js/nigeria-data.js?v=20261109_2200"></script>
  <script src="js/custom-modal.js?v=20261109_2200"></script>
  <script src="js/custom-picker.js?v=20261109_2200"></script>
  <script src="js/supabase-config.js?v=20261109_2200"></script>
  <script src="js/receipt-generator.js?v=20261109_2200"></script>
  <script src="js/auth-modal.js?v=20261109_2200"></script>
  <script src="js/chat-page.js?v=20261109_2200"></script>
</body>
</html>
